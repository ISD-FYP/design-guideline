name: Deploy Preview to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Set the permissions required by the Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment, cancelling runs in progress.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site
          # preview.html becomes the landing page so it loads at the site root.
          cp preview.html _site/index.html
          cp DESIGN.md _site/DESIGN.md
          cp -r assets _site/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
